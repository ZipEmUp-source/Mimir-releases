name: Release

# Builds one tagged version of Mimir's PRIVATE source and attaches the
# installers to a draft release in THIS repository. Public repositories get
# unlimited free Actions minutes; the private one does not, and macOS runners
# bill ten times over there — which is why the builds live here. Nothing of
# the source is published: the runner checks it out with a read-only deploy
# key, builds, uploads the installers, and is destroyed.
#
#   gh workflow run release.yml -R ZipEmUp-source/Mimir-releases -f tag=v0.17.0
#   gh workflow run release.yml -R ZipEmUp-source/Mimir-releases -f tag=store-v0.17.0 -f edition=store
#
# The tag must already exist in ZipEmUp-source/Mimir. Review the draft here,
# then Publish: that is the moment every installed Mimir's Tidings check sees
# the new version. Logs are public: they show compiler output and file paths,
# never the source, and GitHub masks every secret value.
#
# Two editions come out of the one source (its CLAUDE.md, "Editions"), and
# they must never collide: an installed Mimir of one edition may never be
# offered, or silently updated into, the other.
#   standard — tag vX.Y.Z, a full release; it is what GitHub's `latest` names,
#     so it is what the ordinary edition's updater endpoint
#     (releases/latest/download/latest.json) and Tidings check find.
#   store — tag store-vX.Y.Z (the same version's store build), built with
#     MIMIR_EDITION=store and the merge config src-tauri/tauri.store.conf.json
#     (its own identifier, com.wellmimir.mimir, and its own updater endpoint),
#     and ALWAYS a pre-release, so `latest` never points at it. The store
#     edition finds its releases by listing the `store-v` tags, and its
#     updater reads store/latest.json on this repo's `updates` branch, which
#     announce-release.yml fills in when the store release is published.
#
# Secrets on this repository:
#   SOURCE_DEPLOY_KEY — read-only deploy key registered on the source repo.
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD — sign the
#     update packages; installed Mimirs verify against the public key in the
#     source's tauri.conf.json. Never regenerate.
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD — Developer ID signing.
#   APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID — notarization;
#     or APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8 instead.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag in ZipEmUp-source/Mimir to build, e.g. v0.17.0 (store edition: store-v0.17.0)'
        required: true
        type: string
      edition:
        description: 'Which edition to build: standard (tag vX.Y.Z), or store (tag store-vX.Y.Z, MIMIR_EDITION=store, pre-release)'
        required: false
        type: choice
        default: standard
        options:
          - standard
          - store

permissions:
  contents: read

env:
  # Both halves of the build read this one variable: vite stamps it into the
  # window (npm run build, through tauri's beforeBuildCommand) and build.rs /
  # edition.rs compile it into the native side. Set at the top so neither
  # step can miss it.
  MIMIR_EDITION: ${{ inputs.edition == 'store' && 'store' || 'standard' }}

# Two runs for one tag would race each other creating and filling its draft.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Seconds on a Linux runner, before any Mac minute: the tag is well formed,
  # every secret a build needs exists, the deploy key really reaches the
  # source at that tag, and the changelog has something to say about it.
  preflight:
    name: Secrets, deploy key and tag are in place
    runs-on: ubuntu-24.04
    steps:
      - name: Look before a Mac minute is spent
        env:
          TAG: ${{ inputs.tag }}
          EDITION: ${{ inputs.edition || 'standard' }}
          HAS_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY != '' }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_API: ${{ secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_P8 != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' }}
          HAS_APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          case "$EDITION/$TAG" in
            standard/v[0-9]*.[0-9]*.[0-9]*) ;;
            store/store-v[0-9]*.[0-9]*.[0-9]*) ;;
            standard/store-v*) echo "::error::'$TAG' is a store edition tag; pass -f edition=store to build it."; exit 1 ;;
            store/*) echo "::error::A store edition tag must look like store-v0.17.0, got '$TAG'."; exit 1 ;;
            *) echo "::error::The tag must look like v0.17.0, got '$TAG'."; exit 1 ;;
          esac
          echo "Building the $EDITION edition from $TAG"
          if [ "$HAS_DEPLOY_KEY" != "true" ]; then
            echo "::error::SOURCE_DEPLOY_KEY is not set on this repository, so the source cannot be checked out."
            exit 1
          fi
          if [ "$HAS_SIGNING_KEY" != "true" ] || [ "$HAS_SIGNING_PASSWORD" != "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD must both be set here; a bundled build cannot finish without them."
            exit 1
          fi
          if [ "$HAS_APPLE_CERT" != "true" ]; then
            echo "::warning::Mac builds will be UNSIGNED: APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD are not set. Gatekeeper will object on first open."
          elif [ "$HAS_APPLE_API" = "true" ]; then
            echo "::notice::Mac builds will be signed and notarized (App Store Connect API key)."
          elif [ "$HAS_APPLE_ID" = "true" ] && [ "$HAS_APPLE_TEAM" = "true" ]; then
            echo "::notice::Mac builds will be signed and notarized (Apple ID)."
          elif [ "$HAS_APPLE_ID" = "true" ]; then
            echo "::error::APPLE_ID and APPLE_PASSWORD are set but APPLE_TEAM_ID is not; the Mac builds would fail at the notarization step."
            exit 1
          else
            echo "::warning::Mac builds will be signed but NOT notarized: set APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID (or the APPLE_API_* trio)."
          fi

      - name: The deploy key reaches the source at that tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ZipEmUp-source/Mimir
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 1

      - name: The changelog has a section for it
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # release-notes.mjs reads either edition's tag: store-v0.17.0 names
          # the same section as v0.17.0.
          title=$(node scripts/release-notes.mjs "$TAG" --title)
          echo "release title: ${title:-(none; the body will say so)}"
          node scripts/release-notes.mjs "$TAG" | head -3

      - name: The store edition's merge config is there
        if: inputs.edition == 'store'
        run: |
          node -e '
            const c = JSON.parse(require("fs").readFileSync("src-tauri/tauri.store.conf.json", "utf8"));
            const base = JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json", "utf8"));
            if (!c.identifier || c.identifier === base.identifier) throw new Error("the store edition must have its own identifier");
            const endpoints = c.plugins?.updater?.endpoints ?? [];
            if (endpoints.length !== 1 || !endpoints[0].includes("/updates/store/latest.json")) throw new Error("the store edition must read store/latest.json on the updates branch");
            if (c.plugins?.updater?.pubkey) throw new Error("the merge config must not touch the updater pubkey");
            console.log("store edition:", c.identifier, "→", endpoints[0]);
          '

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check out the private source at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ZipEmUp-source/Mimir
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            well-runtime/package-lock.json

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # The edition is compiled in (rerun-if-env-changed), so each keeps
          # its own cache rather than invalidating the other's.
          key: ${{ inputs.edition || 'standard' }}

      - run: npm ci

      - name: Prepare embedded Well runtime
        run: npm run desktop:runtime -- --target ${{ matrix.target }}

      - name: Verify embedded Well runtime
        run: npm run desktop:runtime:verify

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          {
            echo "title=$(node scripts/release-notes.mjs "$TAG" --title)"
            # v0.17.0 or store-v0.17.0 → 0.17.0
            bare="${TAG#store-}"; echo "version=${bare#v}"
            echo 'body<<MIMIR_NOTES_EOF'
            node scripts/release-notes.mjs "$TAG"
            echo 'MIMIR_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

      # The bundler signs when APPLE_CERTIFICATE and its password are SET, not
      # when they are non-empty, and a missing secret arrives as an empty
      # string; the script exports them only when they hold something.
      - name: Apple signing and notarization, when the secrets exist
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/ci-apple-env.sh

      - name: Apple accepts the notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci-apple-verify.sh

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # This repository's own token: the release is created right here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # bundle.createUpdaterArtifacts signs each installer with this key;
          # the .sig files and latest.json ride along on the release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Both Windows installers are built; the in-app download button and
          # the README point people at the NSIS one, so that is the package
          # latest.json names for plain "windows-x86_64".
          updaterJsonPreferNsis: true
          # The tag lives in the source repo, not here; GitHub creates it here
          # on publish, from this branch.
          releaseCommitish: main
          tagName: ${{ inputs.tag }}
          # "Mimir v0.17.0 — Title", or "Mimir v0.17.0 — Title (store edition)"
          # for the store build of the same version (the version is the tag
          # without its store- prefix).
          releaseName: ${{ format('Mimir {0}{1}{2}', inputs.edition == 'store' && format('v{0}', steps.notes.outputs.version) || inputs.tag, steps.notes.outputs.title != '' && format(' — {0}', steps.notes.outputs.title) || '', inputs.edition == 'store' && ' (store edition)' || '') }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          # A store release is ALWAYS a pre-release: GitHub's `latest` skips
          # pre-releases, so the ordinary edition's updater endpoint and
          # Tidings check can never land on a store build.
          prerelease: ${{ inputs.edition == 'store' }}
          # The store edition is built with its merge config on top of
          # tauri.conf.json: its own identifier and updater endpoint, the same
          # product name and the same updater pubkey.
          args: ${{ format('{0}{1}', matrix.args, inputs.edition == 'store' && ' --config src-tauri/tauri.store.conf.json' || '') }}
